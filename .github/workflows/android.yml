name: Android app

on:
  push:
    branches: [claude/credit-dispute-system]
    paths: ["credit-dispute-system/mobile/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: credit-dispute-system/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx cap sync android
      - name: Build test APK (install on a phone to try it)
        working-directory: credit-dispute-system/mobile/android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: test-apk
          path: credit-dispute-system/mobile/android/app/build/outputs/apk/debug/*.apk
      - name: Build signed release bundle for Google Play (only when signing secrets are set)
        if: ${{ env.KEYSTORE_B64 != '' }}
        working-directory: credit-dispute-system/mobile/android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.jks" ./gradlew bundleRelease
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('credit-dispute-system/mobile/android/app/build/outputs/bundle/release/*.aab') != '' }}
        with:
          name: google-play-bundle
          path: credit-dispute-system/mobile/android/app/build/outputs/bundle/release/*.aab
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
