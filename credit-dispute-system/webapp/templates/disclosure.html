{% extends "base.html" %}{% block body %}
<h1>6. Your rights</h1>
<p>Federal law requires us to give you this statement, as a separate document, before you sign anything.</p>
<pre>{{ text }}</pre>
<a class="small" href="{{ url_for('case_disclosure_pdf', case_id=row.id) }}">Download a copy (PDF)</a>
<form class="card" method="post"><input type="hidden" name="csrf" value="{{ csrf_token() }}">
<label style="font-weight:400"><input type="checkbox" name="ack" value="1"> I have received and read the statement above.</label>
<label>Type your full name to sign</label><input name="signature" required><button>Sign and continue</button></form>
{% endblock %}
