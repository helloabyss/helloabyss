{% extends "base.html" %}{% block body %}
<h1>Create a firm account</h1>
<form class="card" method="post"><input type="hidden" name="csrf" value="{{ csrf_token() }}">
<label>Firm legal name (appears on client contracts)</label><input name="firm" required>
<label>Firm business address (appears on client contracts)</label><input name="address" placeholder="100 Main St, Suite 2, City, ST 12345" required>
<label>Your email</label><input name="email" type="email" required autocomplete="email">
<label>Password (10+ characters)</label><input name="password" type="password" required autocomplete="new-password">
<button>Create firm account</button></form>
{% endblock %}
