{% extends "base.html" %}{% block body %}
<h1>{{ 'Create your account' if mode == 'register' else 'Log in' }}</h1>
<form class="card" method="post"><input type="hidden" name="csrf" value="{{ csrf_token() }}">
<label>Email</label><input name="email" type="email" required autocomplete="email">
<label>Password{% if mode == 'register' %} (10+ characters){% endif %}</label>
<input name="password" type="password" required autocomplete="{{ 'new-password' if mode == 'register' else 'current-password' }}">
<button>{{ 'Create account' if mode == 'register' else 'Log in' }}</button></form>
{% if mode == 'register' %}<p class="small">Have an account? <a href="{{ url_for('login') }}">Log in</a></p>
{% else %}<p class="small">New here? <a href="{{ url_for('register') }}">Create an account</a></p>{% endif %}
{% endblock %}
