# FREE DEMO on Render. Data is erased whenever the service restarts or sleeps.
# Not for real customers: see credit-dispute-system/render.production.yaml for that.
# In Render: New > Blueprint > choose this repository and the claude/credit-dispute-system branch.
services:
  - type: web
    name: credit-dispute-demo
    runtime: docker
    rootDir: credit-dispute-system
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: DEMO_MODE
        value: "1"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE
        value: /tmp/cfads.db
      - key: COMPANY_NAME
        value: "Demo Company LLC"
      - key: COMPANY_ADDRESS
        value: "123 Demo Street, Anytown, CA 90000"
