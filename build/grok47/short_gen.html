<!doctype html><html><head><meta charset=utf-8><style>
html,body{margin:0;background:#0B0B0D}canvas{display:block}</style></head>
<body><canvas id=c width=1080 height=1920></canvas>
<script src="engine.js"></script>
<script>
const qs=new URLSearchParams(location.search), id=qs.get('s')||'2';
const load=s=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=s;});
fetch('spec'+id+'.json').then(r=>r.json()).then(async spec=>{
  const imgs=await Promise.all(spec.plates.map(p=>load(p)));
  window.__init(spec,imgs);window.__seek(0);window.__ready=true;
});
</script></body></html>
