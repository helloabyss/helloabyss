<!doctype html><html><head><meta charset=utf-8><style>
html,body{margin:0;background:#0B0B0D}canvas{display:block}</style></head>
<body><canvas id=c></canvas>
<script>
// PARADOCS10X hero thumbnail: one dominant subject (the hero) on the left third, the matchup across the top-right,
// one stakes pill. ?w=1280&h=720&img=hero.jpg&l=DOTS&r=GROK%20BOT&tag=%24100%20vs%20%2420&tx=0.35
const q=new URLSearchParams(location.search),W=+q.get('w')||1280,H=+q.get('h')||720,cv=document.getElementById('c');cv.width=W;cv.height=H;
const x=cv.getContext('2d'),F='"Montserrat","Liberation Sans",Arial,sans-serif',ACC='#FFB020',BLUE='#3DA9FC',RED='#FF4A3D';
const TX=+(q.get('tx')||0.35); // left edge of the text block, as a fraction of W (keep it clear of the hero)
function word(s,X,Y,px,col,al){x.font=`900 ${px}px ${F}`;x.textAlign=al;x.textBaseline='middle';x.lineJoin='round';
  x.shadowColor='rgba(0,0,0,.75)';x.shadowBlur=px*.18;x.shadowOffsetY=px*.06;x.lineWidth=px*.22;x.strokeStyle='#000';x.strokeText(s,X,Y);
  x.shadowColor='transparent';x.shadowBlur=0;x.shadowOffsetY=0;x.fillStyle=col;x.fillText(s,X,Y)}

// ---- style=yt: classic YouTube treatment ----
function sticker(str,X,Y,px,col,al){x.font=`900 ${px}px ${F}`;x.textAlign=al;x.textBaseline='middle';x.lineJoin='round';
  x.lineWidth=px*.26;x.strokeStyle='#000';x.strokeText(str,X+px*.05,Y+px*.07);x.fillStyle='#000';x.fillText(str,X+px*.05,Y+px*.07); // hard drop
  x.lineWidth=px*.24;x.strokeStyle='#000';x.strokeText(str,X,Y);x.fillStyle=col;x.fillText(str,X,Y)}
function arrow(x0,y0,x1,y1,w){const a=Math.atan2(y1-y0,x1-x0),L=Math.hypot(x1-x0,y1-y0);x.save();x.translate(x0,y0);x.rotate(a);
  const path=()=>{x.beginPath();x.moveTo(0,-w*.35);x.quadraticCurveTo(L*.5,-w*.9,L-w*1.6,-w*.4);x.lineTo(L-w*1.6,-w*1.3);x.lineTo(L,0);x.lineTo(L-w*1.6,w*1.3);x.lineTo(L-w*1.6,w*.4);x.quadraticCurveTo(L*.5,-w*.1,0,w*.35);x.closePath()};
  path();x.lineWidth=w*.5;x.strokeStyle='#000';x.lineJoin='round';x.stroke();x.fillStyle='#FF2B2B';x.fill();x.restore()}
function drawYT(img){x.fillStyle='#0B0B0D';x.fillRect(0,0,W,H);
  if(img){const k=Math.max(W/img.width,H/img.height)*1.04,dw=img.width*k,dh=img.height*k;x.filter='saturate(1.5) contrast(1.2) brightness(1.15)';x.drawImage(img,(W-dw)/2-W*.02,(H-dh)/2,dw,dh);x.filter='none'}
  const v=x.createRadialGradient(W*.3,H*.5,H*.2,W*.5,H*.5,W*.75);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.55)');x.fillStyle=v;x.fillRect(0,0,W,H);
  const L1=q.get('l')||'DOTS',L2=q.get('r')||'GROK BOT',T=q.get('tag')||'',X0=W*TX,maxW=W*(0.97-TX),vsMode=q.get('vs')!=='0';
  const fit=(str,px,mw)=>{x.font=`900 ${px}px ${F}`;while(x.measureText(str).width>mw&&px>30){px-=2;x.font=`900 ${px}px ${F}`}return px};
  x.save();x.translate(X0+maxW/2,H*.29);x.rotate(-0.06);
  const c1=q.get('c1')||'#FFC21A',c2=q.get('c2')||'#38B6FF';
  const p1=fit(L1,Math.round(H*.27),maxW*.95),p2=fit(L2,Math.round(H*.23),maxW*.95);
  sticker(L1,0,-H*.12,p1,c1,'center');sticker(L2,0,H*.12,p2,c2,'center');
  if(vsMode){const r=H*.075;x.beginPath();x.arc(-maxW*.36,0,r,0,7);x.fillStyle='#FF2B2B';x.fill();x.lineWidth=r*.18;x.strokeStyle='#000';x.stroke();
    x.font=`900 ${r*1.05}px ${F}`;x.fillStyle='#fff';x.textAlign='center';x.textBaseline='middle';x.fillText('VS',-maxW*.36,r*.05)}
  x.restore();
  arrow(W*.52,H*.70,W*.335,H*.42,H*.035);
  if(T){const tp=Math.round(H*.085);x.save();x.translate(W*(+(q.get('tagx')||0.72)),H*(+(q.get('tagy')||0.87)));x.rotate(0.03);x.font=`900 ${tp}px ${F}`;const w=x.measureText(T).width+tp*1.2;
    x.fillStyle='#000';x.beginPath();x.roundRect(-w/2+6,-tp*.8+8,w,tp*1.6,tp*.3);x.fill();x.fillStyle='#FFE14D';x.beginPath();x.roundRect(-w/2,-tp*.8,w,tp*1.6,tp*.3);x.fill();
    x.lineWidth=tp*.08;x.strokeStyle='#000';x.stroke();x.fillStyle='#000';x.textAlign='center';x.textBaseline='middle';x.fillText(T,0,3);x.restore()}}
const im=new Image();im.onload=()=>{(q.get('style')==='yt'?drawYT:draw)(im);window.__ready=true};im.onerror=()=>{draw(null);window.__ready=true};im.src=q.get('img')||'hero.jpg';
function draw(img){x.fillStyle='#0B0B0D';x.fillRect(0,0,W,H);
  if(img){const k=Math.max(W/img.width,H/img.height),dw=img.width*k,dh=img.height*k;x.filter='saturate(1.25) contrast(1.1) brightness(1.12)';x.drawImage(img,(W-dw)/2,(H-dh)/2,dw,dh);x.filter='none'}
  // darken only behind the text (top right), keep the hero bright
  const g=x.createLinearGradient(0,0,0,H*.6);g.addColorStop(0,'rgba(0,0,0,.55)');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(W*TX-40,0,W,H*.6);
  const L=q.get('l')||'DOTS',R=q.get('r')||'GROK BOT',T=q.get('tag')||'',X0=W*TX,maxW=W*(0.98-TX);
  const fit=(str,px,mw)=>{x.font=`900 ${px}px ${F}`;while(x.measureText(str).width>mw&&px>30){px-=2;x.font=`900 ${px}px ${F}`}return px};
  if(q.get('stack')!=='0'){ // stacked: L on line 1, "vs R" on line 2, both as big as the width allows
    const p1=fit(L,Math.round(H*.30),maxW);const vsPx=Math.round(H*.10);x.font=`900 ${vsPx}px ${F}`;const vsW=x.measureText('vs').width+H*.03;
    const p2=fit(R,Math.round(H*.26),maxW-vsW);
    word(L,X0,H*.17,p1,ACC,'left');word('vs',X0,H*.41,vsPx,'#FFFFFF','left');word(R,X0+vsW,H*.40,p2,BLUE,'left');
  }else{let px=fit(L+' VS '+R,Math.round(H*.2),maxW);let X=X0,Y=H*.16;word(L,X,Y,px,ACC,'left');X+=x.measureText(L).width;
    const vw=x.measureText(' VS ').width*.6;word('VS',X+vw/2,Y,Math.round(px*.6),'#FFFFFF','center');X+=vw;word(R,X,Y,px,BLUE,'left')}
  if(T){const tp=Math.round(H*.095);x.font=`900 ${tp}px ${F}`;const w=x.measureText(T).width+tp*1.3,cx=+(q.get('tagx')||0.5)*W,cy=+(q.get('tagy')||0.86)*H;
    x.shadowColor='rgba(0,0,0,.6)';x.shadowBlur=tp*.5;x.shadowOffsetY=tp*.12;x.fillStyle=RED;x.beginPath();x.roundRect(cx-w/2,cy-tp*.85,w,tp*1.7,tp*.85);x.fill();
    x.shadowColor='transparent';x.shadowBlur=0;x.shadowOffsetY=0;x.fillStyle='#FFFFFF';x.textAlign='center';x.textBaseline='middle';x.fillText(T,cx,cy+3)}}
</script></body></html>
